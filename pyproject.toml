[project]
name = "quantime"
version = "0.0.0"
description = "quantime — 美股 + 美股期权 + 加密、日线级别量化研究系统（workspace root）"
requires-python = ">=3.14"
dependencies = [
    "quantime-core",
    "quantime-data",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
quantime-core = { workspace = true }
quantime-data = { workspace = true }

[dependency-groups]
dev = [
    # bench 生成器（fixtures/bench/bench_gen.py）与测试用；numpy 是 ADR-0003 §2 的计算基线。
    "numpy>=2.3",
    "pytest>=9.1",
    "ruff>=0.16",
    "import-linter>=2.15",
    "pyyaml>=6",
    # 摄取 CLI 的 `ingest` extra 同款客户端。测试装它**不是为了出网**——而是为了用
    # httpx 自己的 URL 规范化 + MockTransport 离线证明「白名单外的路径发不出去」
    # （verify-a R1 P1-2）。用假的 URL 解析器证不了这件事：被绕过的正是真实解析。
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/data/tests", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.importlinter]
root_packages = ["quantime_core", "quantime_data"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "ADR-0003 §3.2 分层：data → core 单向，core 不得 import 上层"
type = "layers"
layers = ["quantime_data", "quantime_core"]

[[tool.importlinter.contracts]]
name = "ADR-0003 §3.3 core 不得 import 任何网络客户端"
type = "forbidden"
source_modules = ["quantime_core"]
forbidden_modules = ["httpx", "websockets", "requests", "urllib", "http", "socket"]
