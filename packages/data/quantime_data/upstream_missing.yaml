# 上游确实不存在的归档白名单（QNT-45 第 3 项）。
#
# 语义：这些文件**不是我们漏采了**，而是上游本来就没有。补采会跳过它们而不是每天重试
# 一遍——否则一个永远不会出现的 2019 年归档，会让每天的报告都停在 partial，直到没人再看
# 报告为止（告警疲劳），而真正的缺口就此被淹没。
#
# 纪律：
# * 入表须先**人工核对过上游确实 404**，并在 `reason` 里写清核对依据与日期；
# * 本文件入版本控制，改动走 PR——「这段数据上游没有」是一个需要被审的结论，不是运行时状态；
# * 只按 `source` + 精确 `filename` 匹配，不支持通配：一条白名单只豁免一个文件，
#   写成 `*` 就等于关掉整个覆盖检查。
#
# 空表是正常的：QNT-28 的录制区间内上游归档齐全，本卡未新增任何豁免。
version: 1
entries: []
#  示例（勿直接启用）：
#  - source: binance_vision
#    filename: BTCUSDT-1d-2017-06.zip
#    reason: "Vision 现货归档自 2017-08 起；2017-06 上游无此文件（2026-09-23 人工核对 404）"
#    verified_on: 2026-09-23
