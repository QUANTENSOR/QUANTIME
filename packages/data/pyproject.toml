[project]
name = "quantime-data"
version = "0.0.0"
description = "quantime 数据中心：append-only 摄取写入、ingestion_batch、DuckDB 视图、重放校验"
requires-python = ">=3.14"
dependencies = [
    "quantime-core",
    "pyarrow>=21",
    "duckdb>=1.4",
    # DuckDB 的 TIMESTAMPTZ 列转 Python 对象时需要 pytz（views.py 读 provenance 列）。
    "pytz>=2025.2",
    # 标的清单（universe.yaml）解析。
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
# 摄取 CLI 的网络出口。只有 `quantime_data.cli` import 它，且只在函数体内。
ingest = [
    "httpx>=0.28",
    # QNT-47 阶段 2：Massive Flat Files（S3 兼容，SigV4）。只在 `cli.py` 的工厂函数体内
    # import；只读封装与事件钩子在 `flatfiles.py`（只放行 ListObjectsV2 / GetObject）。
    "boto3>=1.40",
]

[project.scripts]
quantime-ingest = "quantime_data.cli:main"
quantime-ingest-us = "quantime_data.cli:main_us"

[tool.hatch.build.targets.wheel]
packages = ["quantime_data"]

[tool.uv.sources]
quantime-core = { workspace = true }
