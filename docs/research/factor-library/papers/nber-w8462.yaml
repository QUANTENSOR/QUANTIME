- name: close
  frequency: daily
- name: volume
  frequency: daily
- name: market_cap
  frequency: daily
original_findings:
  sample_market: 美股，34 年
  sample_period: 摘要写 34-year period，未给起止年
  stats: 高流动性敏感相对低敏感，年化多空约 7.5%（已调市场/规模/价值/动量，摘要）。
reproducible: 'yes'
reproducible_reason: 日线收益、成交量与市值即可构造 PS 流动性状态与 beta（成交量视为 OHLCV 的 V）。待付费源。
