- Robert F. Stambaugh
year: 2001
factor_name: Pastor-Stambaugh liquidity beta
factor_definition: 个股日度反转对订单流的敏感度代理非流动性，截面平均得市场流动性状态；股票收益对流动性冲击的 beta 高则预期收益高。
