original_findings:
  sample_market: Bitcoin, Ripple, Ethereum（摘要）
  sample_period: 摘要未给起止年
  stats: 与股票/外汇/贵金属多数常见因子无暴露；存在强时间序列动量，关注代理也能预测收益（摘要，无 t 值数字）。
reproducible: 'yes'
reproducible_reason: 摘要把时间序列动量单独列为加密特有预测因子（滞后收益），与关注代理是并列发现、不是动量因子的输入。Vision OHLCV 的 close
  可按该定义直接计算。
