name: CI

# ADR-0003 §3.2/§9：lint（ruff）+ import-linter + pytest，Python 3.14（QNT-27 范围 9）。
# 不下载任何行情数据；唯一的网络访问是 uv 装依赖。

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.14 and sync workspace
        run: uv sync --frozen --python 3.14

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Dependency direction (import-linter, ADR-0003 §3.2)
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest -q

      - name: Static guards (ADR-0002 只 insert / crypto-boundaries ②)
        run: |
          # `set -e` 按 POSIX **不适用于**被 `!` 取反的命令，所以 `! grep ... | grep .`
          # 这种写法不会让步骤失败——整步的退出码只由最后一条决定，前面几条形同虚设
          # （QNT-28 变异验证暴露）。改成显式计数：每条检查各自记账，最后一起判。
          fail=0
          deny() {  # deny <说明> <ERE 模式> [额外的 grep -v 过滤...]
            local label="$1" pattern="$2"; shift 2
            echo "--- $label ---"
            local hits
            hits=$(grep -rEn --include='*.py' "$pattern" packages/ \
                   | grep -v '/tests/' | grep -vP '^[^:]+:\d+:\s*#' || true)
            for filter in "$@"; do
              hits=$(printf '%s' "$hits" | grep -v "$filter" || true)
            done
            if [ -n "$hits" ]; then
              printf '%s\n' "$hits"
              fail=1
            fi
          }

          deny "写入路径不得出现改写语义" 'UPDATE|DELETE|overwrite|mode=.w.'

          # `grep -rEn` 的输出是 `path:lineno:text`，注释过滤必须剥掉这段前缀再看行首，
          # 否则 `grep -v '^\s*#'` 永远匹配不到（QNT-27 P2：CI run 35566457361 失败点）。
          # 范围不变（整个 packages/ 非测试代码）。
          deny "非 allowlist 文件不得出现主网 host 字面量" \
            'api\.binance\.com|fapi\.binance\.com|api\.bybit\.com|www\.okx\.com|api\.bitget\.com'

          # 公共只读摄取不该认识任何下单/账户/资金路径。`/sapi/` 全段禁（钱包/划转/提币），
          # `userDataStream` 禁（需 listenKey，属账户面）。
          deny "交易/账户/资金端点字面量不得出现（QNT-28：摄取只走公共只读）" \
            '/api/v3/(order|openOrders|allOrders|account|myTrades|userDataStream)|/fapi/v[0-9]+/(order|positionRisk|account|balance|leverage)|/sapi/'

          # 出网点收敛到一处：allowlist / 路径白名单 / 退避都在 transport 上游，
          # 任何第二个 import 网络客户端的模块都可能绕过它们。
          # urllib.parse 是纯字符串解析、不出网，所以按子模块匹配而不是整个 urllib。
          deny "网络客户端只许出现在摄取 CLI 里" \
            '^\s*(import|from)\s+(httpx|requests|websockets|socket|urllib\.request|http\.client)\b' \
            'quantime_data/cli\.py'

          exit "$fail"

      - name: Credential guards (QNT-48：无 key 形态字面量 / 只跟踪 *.tpl)
        run: |
          # 与上面的静态守卫同样用显式计数记账：`! grep` 不受 `set -e` 约束，
          # 一串取反命令只有最后一条的退出码算数（QNT-28 变异验证暴露过）。
          fail=0

          # ① key 形态字面量。三段：赋给 token/secret/api_key 的非空长字符串常量；
          #    `op://` 引用里带看起来像秘钥的长串（模板里只该有 `/credential` 这种字段名）；
          #    40 位以上十六进制（Tushare token 的实际形态）。
          echo "--- 无 key 形态字面量 ---"
          hits=$(grep -rEn --include='*.py' \
                 '(token|secret|api_?key|passwd|password|credential)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"'{}$]{16,}["'"'"']|op://[A-Za-z0-9 _-]+/[A-Za-z0-9 _-]+/[0-9a-f]{16,}|\b[0-9a-f]{40,}\b' \
                 packages/ | grep -v '/tests/' | grep -vP '^[^:]+:\d+:\s*#' || true)
          if [ -n "$hits" ]; then printf '%s\n' "$hits"; fail=1; fi

          # ② 只跟踪 *.tpl：任何被 git 跟踪的 env 文件都必须是模板（AGENTS.md §3）。
          echo "--- env 文件只跟踪 *.tpl ---"
          envs=$(git ls-files | grep -E '(^|/)\.env|\.env\.|env\.tpl$' | grep -v '\.tpl$' || true)
          if [ -n "$envs" ]; then printf '%s\n' "$envs"; fail=1; fi

          # ③ 明文出口唯一：`SecretValue.reveal()` 只许在 transport.py 里出现一次。
          #    多一处调用就多一条能把 token 拼进日志的路径。
          echo "--- reveal() 唯一出口 ---"
          reveals=$(grep -rEn --include='*.py' '\.reveal\(\)' packages/ | grep -v '/tests/' || true)
          outside=$(printf '%s' "$reveals" | grep -v 'quantime_data/transport\.py' || true)
          count=$(printf '%s' "$reveals" | grep -c . || true)
          if [ -n "$outside" ] || [ "$count" != "1" ]; then
            echo "reveal() 出现 $count 处（期望 1 处，且只在 transport.py）:"
            printf '%s\n' "$reveals"
            fail=1
          fi

          exit "$fail"

      - name: Tushare synthetic fixtures match their generator (QNT-48)
        run: uv run --package quantime-data python fixtures/tushare_pro/synth_gen.py --check

      - name: Bench input reproducibility (ADR-0003 §5.1)
        run: uv run python fixtures/bench/bench_gen.py --check-expected

  # QNT-40：payload_sha256 曾在 AVX-512 runner 上与 AVX2 runner 不同（np.exp 按 CPU 分派到
  # 不同 SVML 核）。单机测不出跨 CPU 漂移，所以固定跑一组 CPU 特性不同的 runner。
  bench-repro:
    name: Bench reproducibility across CPU dispatch (QNT-40)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            mask: ""
          - runner: ubuntu-latest
            mask: "AVX512F,AVX512CD,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL"
          - runner: ubuntu-latest
            mask: "AVX2,FMA3,AVX512F,AVX512CD,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL"
          - runner: ubuntu-24.04
            mask: ""
          - runner: ubuntu-22.04
            mask: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.14 and sync workspace
        run: uv sync --frozen --python 3.14

      - name: Record CPU dispatch features
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -o -E 'avx512[a-z0-9_]*|avx2|fma' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          echo "NPY_DISABLE_CPU_FEATURES=${{ matrix.mask }}"

      - name: payload_sha256 must equal EXPECTED.json on every CPU
        env:
          NPY_DISABLE_CPU_FEATURES: ${{ matrix.mask }}
        run: uv run python fixtures/bench/bench_gen.py --check-expected
